name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified npm release
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release-tag

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete release verification
        run: npm run release:check

      - name: Publish to npm with provenance
        run: npm run release:publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
