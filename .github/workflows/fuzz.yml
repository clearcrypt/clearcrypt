name: Parser fuzzing

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: CFENC001 and CFENC002 parsers / 50000 runs each
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the deterministic parser campaign
        run: npm run test:fuzz -- --runs 50000 --seed 847873
